<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMI Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>OMI Expenses</h1>

        <label for="date">Data</label>
        <input id="date" type="date" required>

        <label for="amount">Importo (€)</label>
        <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="0,00"
            required
        >

        <!-- La categoria viene compilata automaticamente dall'OCR -->
        <input id="category" type="hidden" value="">

        <label for="receipt">Scontrino</label>
        <input
            id="receipt"
            type="file"
            accept="image/*"
            capture="environment"
        >

        <button
            id="ocrButton"
            type="button"
            onclick="readReceipt()"
        >
            📷 Leggi scontrino
        </button>

        <div
            id="ocrStatus"
            role="status"
            aria-live="polite"
        ></div>

        <div
            id="detectedCategory"
            style="margin-top:10px; font-weight:600;"
        ></div>

        <details id="ocrDetails" hidden>
            <summary>Testo riconosciuto</summary>
            <pre id="ocrText"></pre>
        </details>

        <button
            id="saveButton"
            type="button"
            onclick="saveExpense()"
        >
            💾 Salva spesa
        </button>

        <hr>

        <h2>Storico spese</h2>
        <div id="expenses"></div>

        <hr>

        <section id="excelExportSection">
            <h2>Report mensile OMI</h2>

            <label for="excelMonth">Mese da esportare</label>
            <input id="excelMonth" type="month">

            <button
                id="excelButton"
                type="button"
                onclick="generateMonthlyExcel()"
            >
                📊 Genera Excel del mese
            </button>

            <div
                id="excelStatus"
                role="status"
                aria-live="polite"
                style="margin-top:10px;"
            ></div>
        </section>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- TESSERACT OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- JSZIP: modifica la copia del template XLSX senza ricostruirlo -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <!-- SCRIPT APP -->
    <script src="ocr.js"></script>
    <script src="app.js"></script>
    <script src="excel.js"></script>

</body>

</html>
