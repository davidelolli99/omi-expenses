<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OMI Expenses</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>OMI Expenses</h1>

        <!-- DATA -->
        <label for="date">
            Data
        </label>

        <input
            id="date"
            type="date"
            required
        >


        <!-- IMPORTO -->
        <label for="amount">
            Importo (€)
        </label>

        <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="0,00"
            required
        >


        <!-- CATEGORIA -->
        <input
    id="category"
    type="hidden"
    value=""
>


        <!-- SCONTRINO -->
        <label for="receipt">
            Scontrino
        </label>

        <input
            id="receipt"
            type="file"
            accept="image/*"
            capture="environment"
        >


        <!-- OCR -->
        <button
            id="ocrButton"
            type="button"
            onclick="readReceipt()"
        >
            📷 Leggi scontrino
        </button>


        <!-- STATO OCR -->
        <div
            id="ocrStatus"
            role="status"
            aria-live="polite"
        ></div>

        <div
    id="detectedCategory"
    style="
        margin-top:10px;
        font-weight:600;
    "
></div>


        <!-- TESTO OCR PER CONTROLLO -->
        <details id="ocrDetails" hidden>

            <summary>
                Testo riconosciuto
            </summary>

            <pre id="ocrText"></pre>

        </details>


        <!-- SALVATAGGIO -->
        <button
            id="saveButton"
            type="button"
            onclick="saveExpense()"
        >
            💾 Salva spesa
        </button>


        <hr>

        <h2>
            Storico spese
        </h2>

        <div id="expenses"></div>

    </main>


    <!-- SUPABASE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- TESSERACT OCR -->
    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>


    <!-- NOSTRI SCRIPT -->
    <script src="ocr.js"></script>

    <script src="app.js"></script>

</body>

</html>
